<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f6f8;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f2f4f6;
            --gray-200: #e5e8eb;
            --gray-300: #d1d6db;
            --gray-400: #b0b8c1;
            --gray-500: #8b95a1;
            --gray-600: #6b7684;
            --gray-700: #4e5968;
            --gray-800: #333d4b;
            --gray-900: #191f28;
            --blue-50: #e8f3ff;
            --blue-100: #c9e2ff;
            --blue-500: #3182f6;
            --blue-600: #1b64da;
            --green-50: #e8faf5;
            --green-500: #2bc484;
            --green-600: #1aab6e;
            --yellow-50: #fff8e6;
            --yellow-500: #f5c542;
            --red-50: #fff0f0;
            --red-500: #f44336;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
            --font: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--gray-900);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 56px;
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--gray-900);
            letter-spacing: -0.3px;
        }
        .tabs {
            display: flex;
            gap: 4px;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: transparent;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-500);
            cursor: pointer;
            transition: all 0.15s;
        }
        .tab:hover { color: var(--gray-700); background: var(--gray-100); }
        .tab.active { color: var(--blue-500); background: var(--blue-50); }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--gray-600);
            font-weight: 500;
        }

        /* ── Main Layout ── */
        .main {
            display: grid;
            grid-template-columns: 1fr 340px;
            height: calc(100vh - 56px);
        }

        /* ── Left: POS ── */
        .pos-pane {
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Menu grid */
        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: -4px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .menu-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 84px;
            padding: 14px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            background: var(--white);
            cursor: pointer;
            transition: all 0.12s;
            text-align: left;
            font-family: var(--font);
        }
        .menu-btn:hover { border-color: var(--blue-500); box-shadow: var(--shadow-sm); }
        .menu-btn:active { transform: scale(0.98); }
        .menu-btn .name {
            font-size: 15px;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1.3;
        }
        .menu-btn .price {
            font-size: 13px;
            color: var(--gray-500);
            font-weight: 500;
        }
        .menu-btn.custom {
            border-style: dashed;
            border-color: var(--gray-300);
            background: var(--gray-50);
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .menu-btn.custom .name { color: var(--gray-600); font-size: 14px; font-weight: 600; }
        .menu-btn.custom .price { color: var(--gray-400); }

        .empty-msg {
            color: var(--gray-500);
            font-size: 14px;
            padding: 40px 0;
            text-align: center;
        }

        /* Current order */
        .order-card {
            background: var(--white);
            border-radius: var(--radius-md);
            border: 1px solid var(--gray-200);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .order-header h2 { font-size: 15px; font-weight: 700; color: var(--gray-800); }
        .clear-btn {
            font-family: var(--font);
            font-size: 12px;
            color: var(--gray-500);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        .clear-btn:hover { color: var(--red-500); }

        .order-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 40px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--gray-800);
        }
        .order-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .order-item-qty {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .qty-btn {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 1px solid var(--gray-200);
            background: var(--white);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-600);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-btn:hover { background: var(--gray-100); }
        .qty-val { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }
        .order-item-price { font-weight: 600; color: var(--gray-700); }
        .order-empty {
            font-size: 13px;
            color: var(--gray-400);
            text-align: center;
            padding: 16px 0;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--gray-200);
        }
        .order-total .label { font-size: 15px; font-weight: 700; color: var(--gray-800); }
        .order-total .amount { font-size: 20px; font-weight: 800; color: var(--gray-900); }

        /* Payment buttons */
        .pay-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .pay-btn {
            height: 44px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--gray-200);
            background: var(--white);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
            cursor: pointer;
            transition: all 0.12s;
        }
        .pay-btn:hover { background: var(--gray-50); border-color: var(--gray-300); }
        .pay-btn:active { transform: scale(0.97); }
        .pay-btn:disabled { opacity: 0.35; cursor: default; transform: none; }
        .pay-btn.qr {
            background: var(--blue-500);
            border-color: var(--blue-500);
            color: var(--white);
        }
        .pay-btn.qr:hover { background: var(--blue-600); }
        .pay-btn.qr:disabled { background: var(--blue-500); opacity: 0.35; }

        /* ── Right: Customer Queue ── */
        .queue-pane {
            border-left: 1px solid var(--gray-200);
            background: var(--white);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .queue-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--gray-800);
        }

        .slot {
            border-radius: var(--radius-sm);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }
        .slot.paid {
            background: #f0f4ff;
            border: 1px solid var(--gray-200);
        }
        .slot.pending {
            background: var(--yellow-50);
            border: 1px solid #f0dfa0;
        }
        .slot-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot-num { font-size: 15px; font-weight: 700; }
        .slot-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 99px;
            background: var(--white);
        }
        .slot-mid {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot-menu { font-size: 13px; }
        .slot-pay-type { font-size: 11px; opacity: 0.7; }
        .slot-price { font-size: 16px; font-weight: 700; }
        .slot-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 4px;
        }
        .slot-act-btn {
            font-family: var(--font);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 6px;
            border: 1px solid;
            background: none;
            cursor: pointer;
        }
        .slot-act-btn:active { transform: scale(0.96); }
        .slot-act-btn.deliver { color: var(--blue-500); border-color: var(--gray-200); }
        .slot-act-btn.deliver:hover { background: var(--blue-50); }
        .slot-act-btn.cancel { color: var(--red-500); border-color: #ffc8c8; }
        .slot-act-btn.cancel:hover { background: var(--red-50); }
        .slot-timer { font-size: 11px; color: var(--gray-500); text-align: center; }

        .queue-empty {
            font-size: 13px;
            color: var(--gray-400);
            text-align: center;
            padding: 40px 0;
        }

        /* Daily summary */
        .daily-summary {
            margin-top: auto;
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            padding: 14px;
            text-align: center;
        }
        .daily-label { font-size: 12px; color: var(--gray-500); font-weight: 500; margin-bottom: 4px; }
        .daily-amount { font-size: 22px; font-weight: 800; color: var(--gray-900); }
        .daily-count { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

        /* ── Toast ── */
        .toast {
            display: none;
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            background: var(--gray-900);
            color: var(--white);
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            white-space: nowrap;
            box-shadow: var(--shadow-md);
        }
        .toast.show { display: block; animation: toast-fade 2s forwards; }
        @keyframes toast-fade { 0%,70%{ opacity:1 } 100%{ opacity:0 } }

        /* ── QR Overlay ── */
        .qr-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .qr-overlay.show { display: flex; }
        .qr-modal {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .qr-order-num { font-size: 14px; color: var(--gray-600); font-weight: 500; }
        .qr-amount { font-size: 24px; font-weight: 800; color: var(--gray-900); }
        .qr-placeholder {
            width: 140px;
            height: 140px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-hint { font-size: 13px; color: var(--gray-500); }
        .qr-btns { display: flex; gap: 8px; }
        .qr-btn {
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--gray-200);
            background: var(--white);
            color: var(--gray-700);
            cursor: pointer;
        }
        .qr-btn:hover { background: var(--gray-50); }
        .qr-btn.primary { background: var(--blue-500); border-color: var(--blue-500); color: var(--white); }
        .qr-btn.primary:hover { background: var(--blue-600); }

        /* ── Custom input modal ── */
        .custom-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .custom-overlay.show { display: flex; }
        .custom-modal {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .custom-modal h3 { font-size: 16px; font-weight: 700; color: var(--gray-800); }
        .custom-modal input {
            height: 40px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            padding: 0 12px;
            font: inherit;
            font-size: 14px;
        }
        .custom-modal input:focus { outline: none; border-color: var(--blue-500); }
        .custom-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .custom-btn {
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--gray-200);
            background: var(--white);
            color: var(--gray-700);
            cursor: pointer;
        }
        .custom-btn:hover { background: var(--gray-50); }
        .custom-btn.primary { background: var(--blue-500); border-color: var(--blue-500); color: var(--white); }
        .custom-btn.primary:hover { background: var(--blue-600); }

        /* ── Management Tab ── */
        .mgmt-pane {
            display: none;
            padding: 24px;
            overflow-y: auto;
        }
        .mgmt-pane.active { display: block; grid-column: 1 / -1; }
        .mgmt-content { max-width: 640px; }
        .mgmt-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .mgmt-title { font-size: 20px; font-weight: 800; color: var(--gray-900); }
        .mgmt-section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: 10px;
        }
        .order-history {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-empty {
            font-size: 13px;
            color: var(--gray-400);
            text-align: center;
            padding: 40px 0;
        }
        .history-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
        }
        .history-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .history-num {
            font-size: 14px;
            font-weight: 700;
            color: var(--gray-800);
            min-width: 36px;
        }
        .history-menu {
            font-size: 13px;
            color: var(--gray-600);
        }
        .history-right {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: right;
        }
        .history-amount {
            font-size: 14px;
            font-weight: 700;
            color: var(--gray-800);
        }
        .history-pay {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 99px;
            background: var(--gray-100);
            color: var(--gray-600);
        }
        .history-status {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 99px;
        }
        .history-status.delivered { background: var(--green-50); color: var(--green-600); }
        .history-status.cancelled { background: var(--red-50); color: var(--red-500); }

        /* Hide/show */
        .pos-pane.hidden, .queue-pane.hidden { display: none; }

        @media (max-width: 760px) {
            .main { grid-template-columns: 1fr; }
            .queue-pane { border-left: 0; border-top: 1px solid var(--gray-200); }
        }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="qrOverlay" class="qr-overlay">
    <div class="qr-modal">
        <div class="qr-order-num">주문 <span id="qrOrderNum">#1</span></div>
        <div class="qr-amount" id="qrAmount">0원</div>
        <div class="qr-placeholder">
            <svg width="88" height="88" viewBox="0 0 80 80" fill="none">
                <rect x="2" y="2" width="26" height="26" rx="2" stroke="#d1d6db" stroke-width="2"/>
                <rect x="8" y="8" width="14" height="14" rx="1" fill="#d1d6db"/>
                <rect x="52" y="2" width="26" height="26" rx="2" stroke="#d1d6db" stroke-width="2"/>
                <rect x="58" y="8" width="14" height="14" rx="1" fill="#d1d6db"/>
                <rect x="2" y="52" width="26" height="26" rx="2" stroke="#d1d6db" stroke-width="2"/>
                <rect x="8" y="58" width="14" height="14" rx="1" fill="#d1d6db"/>
                <rect x="36" y="2" width="8" height="8" rx="1" fill="#d1d6db" opacity="0.5"/>
                <rect x="36" y="14" width="8" height="8" rx="1" fill="#d1d6db" opacity="0.3"/>
                <rect x="52" y="52" width="12" height="12" rx="1" fill="#d1d6db" opacity="0.4"/>
                <rect x="66" y="52" width="12" height="12" rx="1" fill="#d1d6db" opacity="0.3"/>
                <rect x="52" y="66" width="12" height="12" rx="1" fill="#d1d6db" opacity="0.3"/>
                <rect x="66" y="66" width="12" height="12" rx="1" fill="#d1d6db" opacity="0.2"/>
            </svg>
        </div>
        <div class="qr-hint">고객이 QR을 스캔해주세요</div>
        <div class="qr-btns">
            <button class="qr-btn primary" onclick="simulatePay()">결제 시뮬레이션</button>
            <button class="qr-btn" onclick="closeQR()">닫기</button>
        </div>
    </div>
</div>

<div id="customOverlay" class="custom-overlay">
    <div class="custom-modal">
        <h3>직접 입력</h3>
        <input type="text" id="customName" placeholder="메뉴명">
        <input type="number" id="customPrice" placeholder="가격 (원)">
        <div class="custom-btns">
            <button class="custom-btn" onclick="closeCustom()">취소</button>
            <button class="custom-btn primary" onclick="addCustom()">추가</button>
        </div>
    </div>
</div>

<header class="header">
    <div class="header-left">
        <span class="logo">POS</span>
        <nav class="tabs">
            <button class="tab active" data-tab="menu" onclick="switchTab('menu')">메뉴</button>
            <button class="tab" data-tab="mgmt" onclick="switchTab('mgmt')">관리</button>
        </nav>
    </div>
    <div class="header-right">
        <span id="storeName">매장명: -</span>
        <span id="businessDate"></span>
    </div>
</header>

<div class="main">
    <section class="pos-pane" id="posPane">
        <div class="section-label">메뉴 선택</div>
        <div class="menu-grid" id="menuGrid"></div>
        <p id="emptyMessage" class="empty-msg" hidden>표시할 메뉴가 없습니다.</p>

        <div class="order-card" id="orderCard">
            <div class="order-header">
                <h2>현재 주문</h2>
                <button class="clear-btn" onclick="clearOrder()">전체 삭제</button>
            </div>
            <div class="order-items" id="orderItems">
                <div class="order-empty">메뉴를 선택해주세요</div>
            </div>
            <div class="order-total">
                <span class="label">합계</span>
                <span class="amount" id="orderTotal">0원</span>
            </div>
            <div class="pay-row">
                <button class="pay-btn" id="btnCash" disabled onclick="payCash()">현금</button>
                <button class="pay-btn" id="btnCard" disabled onclick="payCard()">카드 단말기</button>
                <button class="pay-btn qr" id="btnQr" disabled onclick="payQR()">간편결제</button>
            </div>
        </div>
    </section>

    <section class="mgmt-pane" id="mgmtPane">
        <div class="mgmt-content">
            <div class="mgmt-top">
                <h2 class="mgmt-title">판매 관리</h2>
            </div>
            <div class="daily-summary" style="margin-bottom:20px">
                <div class="daily-label">오늘의 매출</div>
                <div class="daily-amount" id="dailyTotal">0원</div>
                <div class="daily-count" id="dailyCount">0건</div>
            </div>
            <div class="mgmt-section-label">주문 내역</div>
            <div class="order-history" id="orderHistory">
                <div class="history-empty">아직 주문 내역이 없습니다</div>
            </div>
        </div>
    </section>

    <aside class="queue-pane" id="queuePane">
        <div class="queue-title">고객 대기</div>
        <div id="slots"></div>
        <div id="emptySlots" class="queue-empty">대기 중인 주문이 없습니다</div>
    </aside>
</div>

<script>
    const STORE_ID = 1;
    const fmt = n => new Intl.NumberFormat('ko-KR').format(n) + '원';

    let order = [];
    let orderNum = 0;
    let slots = [];
    let dailySales = 0;
    let dailyCount = 0;
    let currentQRSlotId = null;
    let orderHistory = [];

    /* ── Init ── */
    function init() {
        loadBusinessDate();
        loadStore();
        loadMenus();
        renderOrder();
        renderSlots();
    }

    function loadBusinessDate() {
        const today = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        document.getElementById('businessDate').textContent = `영업일: ${today}`;
    }

    async function loadStore() {
        try {
            const res = await fetch(`/api/stores/${STORE_ID}`);
            if (res.ok) {
                const store = await res.json();
                document.getElementById('storeName').textContent = `${store.name}`;
            }
        } catch (e) { /* fallback */ }
    }

    async function loadMenus() {
        const grid = document.getElementById('menuGrid');
        const empty = document.getElementById('emptyMessage');
        try {
            const res = await fetch(`/api/menus?storeId=${STORE_ID}`);
            if (!res.ok) throw new Error();
            const menus = await res.json();

            grid.innerHTML = '';
            menus.forEach(m => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.innerHTML = `<span class="name">${m.name}</span><span class="price">${fmt(m.price)}</span>`;
                btn.onclick = () => addItem(m.name, m.price);
                grid.appendChild(btn);
            });

            // 직접 입력 버튼
            const customBtn = document.createElement('button');
            customBtn.className = 'menu-btn custom';
            customBtn.innerHTML = '<span class="name">직접 입력</span><span class="price">가격 수정</span>';
            customBtn.onclick = openCustom;
            grid.appendChild(customBtn);

            empty.hidden = menus.length > 0;
        } catch (e) {
            grid.innerHTML = '';
            empty.hidden = false;
        }
    }

    /* ── Tabs ── */
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
        document.getElementById('posPane').classList.toggle('hidden', tab !== 'menu');
        document.getElementById('mgmtPane').classList.toggle('active', tab === 'mgmt');
        document.getElementById('queuePane').classList.toggle('hidden', tab !== 'menu');
        if (tab === 'mgmt') renderHistory();
    }

    /* ── Order ── */
    function addItem(name, price) {
        const existing = order.find(o => o.name === name && o.price === price);
        if (existing) existing.qty++;
        else order.push({ name, price, qty: 1 });
        renderOrder();
    }

    function changeQty(idx, delta) {
        order[idx].qty += delta;
        if (order[idx].qty <= 0) order.splice(idx, 1);
        renderOrder();
    }

    function clearOrder() { order = []; renderOrder(); }

    function getTotal() { return order.reduce((s, o) => s + o.price * o.qty, 0); }

    function renderOrder() {
        const container = document.getElementById('orderItems');
        const total = document.getElementById('orderTotal');
        const hasItems = order.length > 0;

        document.getElementById('btnCash').disabled = !hasItems;
        document.getElementById('btnCard').disabled = !hasItems;
        document.getElementById('btnQr').disabled = !hasItems;
        total.textContent = fmt(getTotal());

        if (!hasItems) {
            container.innerHTML = '<div class="order-empty">메뉴를 선택해주세요</div>';
            return;
        }

        container.innerHTML = '';
        order.forEach((o, i) => {
            const row = document.createElement('div');
            row.className = 'order-item';
            row.innerHTML = `
                <div class="order-item-left">
                    <span>${o.name}</span>
                    <div class="order-item-qty">
                        <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
                        <span class="qty-val">${o.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
                    </div>
                </div>
                <span class="order-item-price">${fmt(o.price * o.qty)}</span>`;
            container.appendChild(row);
        });
    }

    /* ── Custom Input ── */
    function openCustom() { document.getElementById('customOverlay').classList.add('show'); document.getElementById('customName').focus(); }
    function closeCustom() {
        document.getElementById('customOverlay').classList.remove('show');
        document.getElementById('customName').value = '';
        document.getElementById('customPrice').value = '';
    }
    function addCustom() {
        const n = document.getElementById('customName').value.trim() || '기타';
        const p = parseInt(document.getElementById('customPrice').value) || 0;
        if (p <= 0) return;
        addItem(n, p);
        closeCustom();
    }

    /* ── Toast ── */
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.remove('show');
        void t.offsetWidth;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    /* ── Sound ── */
    function playSound(type) {
        try {
            const ac = new (window.AudioContext || window.webkitAudioContext)();
            const o = ac.createOscillator();
            const g = ac.createGain();
            o.connect(g); g.connect(ac.destination);
            o.frequency.value = type === 'success' ? 880 : 660;
            g.gain.value = 0.1;
            o.start(); o.stop(ac.currentTime + 0.12);
            if (type === 'success') {
                setTimeout(() => {
                    const o2 = ac.createOscillator();
                    const g2 = ac.createGain();
                    o2.connect(g2); g2.connect(ac.destination);
                    o2.frequency.value = 1320;
                    g2.gain.value = 0.1;
                    o2.start(); o2.stop(ac.currentTime + 0.18);
                }, 120);
            }
        } catch (e) {}
    }

    /* ── Sales ── */
    function updateSales() {
        document.getElementById('dailyTotal').textContent = fmt(dailySales);
        document.getElementById('dailyCount').textContent = dailyCount + '건';
    }

    function getMenuSummary() {
        if (order.length === 1) return order[0].name + (order[0].qty > 1 ? ' x' + order[0].qty : '');
        return order[0].name + ' 외 ' + (order.length - 1) + '건';
    }

    /* ── Payments ── */
    function payCash() {
        orderNum++;
        const t = getTotal();
        const summary = getMenuSummary();
        slots.push({ id: orderNum, amount: t, menu: summary, status: 'paid', payType: '현금' });
        dailySales += t; dailyCount++;
        updateSales();
        playSound('cash');
        showToast('#' + orderNum + ' 현금 결제 완료 ' + fmt(t));
        order = []; renderOrder(); renderSlots();
    }

    function payCard() {
        orderNum++;
        const t = getTotal();
        const summary = getMenuSummary();
        slots.push({ id: orderNum, amount: t, menu: summary, status: 'paid', payType: '카드' });
        dailySales += t; dailyCount++;
        updateSales();
        playSound('cash');
        showToast('#' + orderNum + ' 카드 결제 완료 ' + fmt(t));
        order = []; renderOrder(); renderSlots();
    }

    function payQR() {
        orderNum++;
        const t = getTotal();
        const summary = getMenuSummary();
        const slot = { id: orderNum, amount: t, menu: summary, status: 'pending', payType: '간편결제', timer: 180 };
        slots.push(slot);
        currentQRSlotId = orderNum;
        document.getElementById('qrOrderNum').textContent = '#' + orderNum;
        document.getElementById('qrAmount').textContent = fmt(t);
        document.getElementById('qrOverlay').classList.add('show');
        order = []; renderOrder(); renderSlots();
        startTimer(slot);
    }

    function startTimer(slot) {
        const iv = setInterval(() => {
            if (slot.status !== 'pending') { clearInterval(iv); return; }
            slot.timer--;
            if (slot.timer <= 0) { slot.status = 'expired'; clearInterval(iv); }
            renderSlots();
        }, 1000);
    }

    function closeQR() { document.getElementById('qrOverlay').classList.remove('show'); }

    function simulatePay() {
        closeQR();
        const slot = slots.find(s => s.id === currentQRSlotId);
        if (slot) {
            slot.status = 'paid';
            dailySales += slot.amount; dailyCount++;
            updateSales();
            playSound('success');
            showToast('간편결제 완료 #' + slot.id + ' ' + fmt(slot.amount));
            renderSlots();
        }
    }

    function deliverSlot(id) {
        const slot = slots.find(s => s.id === id);
        if (slot) {
            orderHistory.unshift({ id: slot.id, menu: slot.menu, amount: slot.amount, payType: slot.payType, status: '전달완료' });
        }
        slots = slots.filter(s => s.id !== id);
        playSound('cash');
        showToast('#' + id + ' 전달 완료');
        renderSlots();
        renderHistory();
    }

    function cancelSlot(id) {
        const slot = slots.find(s => s.id === id);
        if (slot && slot.status === 'paid') {
            dailySales -= slot.amount; dailyCount--;
            updateSales();
            orderHistory.unshift({ id: slot.id, menu: slot.menu, amount: slot.amount, payType: slot.payType, status: '취소' });
        }
        slots = slots.filter(s => s.id !== id);
        showToast('#' + id + ' 주문 취소');
        renderSlots();
        renderHistory();
    }

    /* ── Render History ── */
    function renderHistory() {
        const container = document.getElementById('orderHistory');
        if (orderHistory.length === 0) {
            container.innerHTML = '<div class="history-empty">아직 주문 내역이 없습니다</div>';
            return;
        }
        container.innerHTML = '';
        orderHistory.forEach(h => {
            const row = document.createElement('div');
            row.className = 'history-row';
            const statusClass = h.status === '취소' ? 'cancelled' : 'delivered';
            row.innerHTML = `
                <div class="history-left">
                    <span class="history-num">#${h.id}</span>
                    <span class="history-menu">${h.menu}</span>
                </div>
                <div class="history-right">
                    <span class="history-amount">${h.status === '취소' ? '-' : ''}${fmt(h.amount)}</span>
                    <span class="history-pay">${h.payType}</span>
                    <span class="history-status ${statusClass}">${h.status}</span>
                </div>`;
            container.appendChild(row);
        });
    }

    /* ── Render Slots ── */
    function renderSlots() {
        const container = document.getElementById('slots');
        const empty = document.getElementById('emptySlots');
        const active = slots.filter(s => s.status !== 'expired');
        empty.style.display = active.length > 0 ? 'none' : 'block';
        container.innerHTML = '';

        active.forEach(s => {
            const isPaid = s.status === 'paid';
            const div = document.createElement('div');
            div.className = 'slot ' + (isPaid ? 'paid' : 'pending');

            const color = isPaid ? 'var(--gray-800)' : '#c49000';
            const payLabel = s.payType;

            let bottom = '';
            if (isPaid) {
                bottom = `<div class="slot-actions">
                    <button class="slot-act-btn deliver" onclick="deliverSlot(${s.id})">전달 완료</button>
                    <button class="slot-act-btn cancel" onclick="cancelSlot(${s.id})">취소</button>
                </div>`;
            } else {
                const min = Math.floor(s.timer / 60);
                const sec = String(s.timer % 60).padStart(2, '0');
                bottom = `<div class="slot-timer">${min}:${sec} 남음</div>`;
            }

            div.innerHTML = `
                <div class="slot-top">
                    <span class="slot-num" style="color:${color}">#${s.id}</span>
                    <span class="slot-badge" style="color:${isPaid ? 'var(--blue-500)' : color}">${isPaid ? '결제 완료' : '결제 대기'}</span>
                </div>
                <div class="slot-mid">
                    <span class="slot-menu" style="color:var(--gray-600)">${s.menu}</span>
                    <span class="slot-pay-type" style="color:var(--gray-600)">${payLabel}</span>
                </div>
                <div class="slot-price" style="color:${color}">${fmt(s.amount)}</div>
                ${bottom}`;
            container.appendChild(div);
        });
    }

    init();
</script>
</body>
</html>
