<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1f2933;
            background: #f4f6f8;
        }

        main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            min-height: 100vh;
        }

        .menu-pane {
            padding: 24px;
        }

        .order-pane {
            border-left: 1px solid #d9e2ec;
            background: #ffffff;
            padding: 24px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        h1,
        h2 {
            margin: 0;
            font-size: 24px;
            line-height: 1.2;
        }

        h2 {
            font-size: 20px;
        }

        .store-meta {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .store-name,
        .business-date {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: #52606d;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
            gap: 12px;
        }

        .menu-button {
            min-height: 96px;
            border: 1px solid #bcccdc;
            border-radius: 8px;
            background: #ffffff;
            padding: 14px;
            text-align: left;
            cursor: pointer;
        }

        .menu-button:hover {
            border-color: #0b7285;
        }

        .menu-name {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.25;
        }

        .menu-price {
            display: block;
            font-size: 16px;
            color: #52606d;
        }

        .empty {
            margin-top: 40px;
            color: #52606d;
            font-size: 16px;
        }

        .order-placeholder {
            margin-top: 20px;
            color: #52606d;
            line-height: 1.5;
        }

        @media (max-width: 760px) {
            main {
                grid-template-columns: 1fr;
            }

            .order-pane {
                border-left: 0;
                border-top: 1px solid #d9e2ec;
            }
        }
    </style>
</head>
<body>
<main>
    <section class="menu-pane" aria-labelledby="menu-title">
        <div class="toolbar">
            <h1 id="menu-title">메뉴</h1>
            <div class="store-meta" aria-label="매장 정보">
                <p id="storeName" class="store-name">매장명: -</p>
                <p id="businessDate" class="business-date">영업일: -</p>
            </div>
        </div>
        <div id="menuGrid" class="menu-grid"></div>
        <p id="emptyMessage" class="empty" hidden>표시할 메뉴가 없습니다.</p>
    </section>
    <aside class="order-pane" aria-labelledby="order-title">
        <h2 id="order-title">주문</h2>
        <p class="order-placeholder">메뉴 조회만 연결된 1단계 화면입니다.</p>
    </aside>
</main>

<script>
    const STORE_ID = 1;
    const storeName = document.querySelector("#storeName");
    const businessDate = document.querySelector("#businessDate");
    const menuGrid = document.querySelector("#menuGrid");
    const emptyMessage = document.querySelector("#emptyMessage");

    function loadBusinessDate() {
        const today = new Intl.DateTimeFormat("ko-KR", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }).format(new Date());

        businessDate.textContent = `영업일: ${today}`;
    }

    function formatPrice(price) {
        return new Intl.NumberFormat("ko-KR").format(price) + "원";
    }

    async function loadStore() {
        const response = await fetch(`/api/stores/${STORE_ID}`);

        if (!response.ok) {
            storeName.textContent = "매장명: -";
            return;
        }

        const store = await response.json();
        storeName.textContent = `매장명: ${store.name}`;
    }

    async function loadMenus() {
        const response = await fetch(`/api/menus?storeId=${STORE_ID}`);

        if (!response.ok) {
            menuGrid.replaceChildren();
            emptyMessage.hidden = false;
            return;
        }

        const menus = await response.json();
        menuGrid.replaceChildren(...menus.map((menu) => {
            const button = document.createElement("button");
            button.className = "menu-button";
            button.type = "button";

            const name = document.createElement("span");
            name.className = "menu-name";
            name.textContent = menu.name;

            const price = document.createElement("span");
            price.className = "menu-price";
            price.textContent = formatPrice(menu.price);

            button.append(name, price);
            return button;
        }));
        emptyMessage.hidden = menus.length > 0;
    }

    loadBusinessDate();
    loadStore();
    loadMenus();
</script>
</body>
</html>
