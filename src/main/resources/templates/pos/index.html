<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f6f8;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f2f4f6;
            --gray-200: #e5e8eb;
            --gray-300: #d1d6db;
            --gray-400: #b0b8c1;
            --gray-500: #8b95a1;
            --gray-600: #6b7684;
            --gray-700: #4e5968;
            --gray-800: #333d4b;
            --gray-900: #191f28;
            --blue-50: #e8f3ff;
            --blue-100: #c9e2ff;
            --blue-500: #3182f6;
            --blue-600: #1b64da;
            --green-50: #e8faf5;
            --green-500: #2bc484;
            --green-600: #1aab6e;
            --yellow-50: #fff8e6;
            --yellow-500: #f5c542;
            --red-50: #fff0f0;
            --red-500: #f44336;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
            --font: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--gray-900);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 56px;
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--gray-900);
            letter-spacing: -0.3px;
        }
        .tabs {
            display: flex;
            gap: 4px;
        }
        .tab {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: transparent;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-500);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }
        .tab:hover { color: var(--gray-700); background: var(--gray-100); }
        .tab.active { color: var(--blue-500); background: var(--blue-50); }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--gray-600);
            font-weight: 500;
        }

        /* ── Main Layout ── */
        .main {
            display: grid;
            grid-template-columns: 3fr 2fr;
            height: calc(100vh - 56px);
        }

        /* ── Left: POS ── */
        .pos-pane {
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Menu grid */
        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: -4px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .menu-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 84px;
            padding: 14px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            background: var(--white);
            cursor: pointer;
            transition: all 0.12s;
            text-align: left;
            font-family: var(--font);
        }
        .menu-btn:hover { border-color: var(--blue-500); box-shadow: var(--shadow-sm); }
        .menu-btn:active { transform: scale(0.98); }
        .menu-btn .name {
            font-size: 15px;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1.3;
        }
        .menu-btn .price {
            font-size: 13px;
            color: var(--gray-500);
            font-weight: 500;
        }
        .menu-btn.custom {
            border-style: dashed;
            border-color: var(--gray-300);
            background: var(--gray-50);
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .menu-btn.custom .name { color: var(--gray-600); font-size: 14px; font-weight: 600; }
        .menu-btn.custom .price { color: var(--gray-400); }

        .empty-msg {
            color: var(--gray-500);
            font-size: 14px;
            padding: 40px 0;
            text-align: center;
        }

        /* Current order */
        .order-card {
            background: var(--white);
            border-radius: var(--radius-md);
            border: 1px solid var(--gray-200);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .order-header h2 { font-size: 15px; font-weight: 700; color: var(--gray-800); }
        .clear-btn {
            font-family: var(--font);
            font-size: 12px;
            color: var(--gray-500);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        .clear-btn:hover { color: var(--red-500); }

        .order-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 40px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--gray-800);
        }
        .order-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .order-item-qty {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .qty-btn {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 1px solid var(--gray-200);
            background: var(--white);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-600);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-btn:hover { background: var(--gray-100); }
        .qty-val { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }
        .order-item-price { font-weight: 600; color: var(--gray-700); }
        .order-empty {
            font-size: 13px;
            color: var(--gray-400);
            text-align: center;
            padding: 16px 0;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--gray-200);
        }
        .order-total .label { font-size: 15px; font-weight: 700; color: var(--gray-800); }
        .order-total .amount { font-size: 20px; font-weight: 800; color: var(--gray-900); }

        /* Payment buttons */
        .pay-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin-top: 12px;
        }
        .pay-btn {
            height: 44px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--gray-200);
            background: var(--white);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
            cursor: pointer;
            transition: all 0.12s;
        }
        .pay-btn:hover { background: var(--gray-50); border-color: var(--gray-300); }
        .pay-btn:active { transform: scale(0.97); }
        .pay-btn:disabled { opacity: 0.35; cursor: default; transform: none; }
        .pay-btn.primary {
            grid-column: 1 / -1;
            height: 52px;
            background: var(--blue-500);
            border-color: var(--blue-500);
            color: var(--white);
            font-size: 16px;
            font-weight: 700;
        }
        .pay-btn.primary:hover { background: var(--blue-600); border-color: var(--blue-600); }
        .pay-btn.primary:disabled { background: var(--blue-500); border-color: var(--blue-500); }

        /* Payment method selection modal */
        .pay-method-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 280px;
        }
        .pay-method-option {
            font-family: var(--font);
            font-size: 15px;
            font-weight: 700;
            height: 56px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--gray-200);
            background: var(--white);
            color: var(--gray-800);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s;
        }
        .pay-method-option:hover { background: var(--gray-50); border-color: var(--blue-500); }
        .pay-method-option:active { transform: scale(0.98); }
        .pay-method-option:disabled { opacity: 0.45; cursor: default; transform: none; }
        .pay-method-option.kakao { background: #fee500; border-color: #e6cf00; color: #191919; }
        .pay-method-option.kakao:hover { background: #f7dc00; border-color: #e6cf00; }

        /* ── Right: Customer Queue ── */
        .queue-pane {
            border-left: 1px solid var(--gray-200);
            background: var(--white);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .queue-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--gray-800);
        }

        .slot {
            border-radius: var(--radius-sm);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s;
        }
        .slot:hover { box-shadow: var(--shadow-sm); }
        .slot:active { transform: scale(0.98); }
        .slot.paid {
            background: #f0f4ff;
            border: 1px solid var(--gray-200);
        }
        .slot.pending {
            background: var(--yellow-50);
            border: 1px solid #f0dfa0;
        }
        .slot-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot-num { font-size: 15px; font-weight: 700; }
        .slot-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 99px;
            background: var(--white);
        }
        .slot-mid {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot-menu { font-size: 13px; }
        .slot-pay-type { font-size: 11px; opacity: 0.7; }
        .slot-price { font-size: 16px; font-weight: 700; }
        .slot-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 4px;
        }
        .slot-act-btn {
            font-family: var(--font);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 6px;
            border: 1px solid;
            background: none;
            cursor: pointer;
        }
        .slot-act-btn:active { transform: scale(0.96); }
        .slot-act-btn.deliver { color: var(--blue-500); border-color: var(--gray-200); }
        .slot-act-btn.deliver:hover { background: var(--blue-50); }
        .slot-act-btn.cancel { color: var(--red-500); border-color: #ffc8c8; }
        .slot-act-btn.cancel:hover { background: var(--red-50); }
        .slot-timer { font-size: 11px; color: var(--gray-500); text-align: center; }

        .queue-empty {
            font-size: 13px;
            color: var(--gray-400);
            text-align: center;
            padding: 40px 0;
        }

        /* Daily summary */
        .daily-summary {
            margin-top: auto;
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            padding: 14px;
            text-align: center;
        }
        .daily-label { font-size: 12px; color: var(--gray-500); font-weight: 500; margin-bottom: 4px; }
        .daily-amount { font-size: 22px; font-weight: 800; color: var(--gray-900); }
        .daily-count { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

        /* ── Toast ── */
        .toast {
            display: none;
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            background: var(--gray-900);
            color: var(--white);
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            white-space: nowrap;
            box-shadow: var(--shadow-md);
        }
        .toast.show { display: block; animation: toast-fade 2s forwards; }
        @keyframes toast-fade { 0%,70%{ opacity:1 } 100%{ opacity:0 } }

        /* ── QR Overlay ── */
        .qr-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .qr-overlay.show { display: flex; }
        .qr-modal {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .qr-order-num { font-size: 14px; color: var(--gray-600); font-weight: 500; }
        .qr-amount { font-size: 24px; font-weight: 800; color: var(--gray-900); }
        .qr-placeholder {
            width: 140px;
            height: 140px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-hint { font-size: 13px; color: var(--gray-500); }
        .qr-btns { display: flex; gap: 8px; }
        .qr-btn {
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--gray-200);
            background: var(--white);
            color: var(--gray-700);
            cursor: pointer;
        }
        .qr-btn:hover { background: var(--gray-50); }
        .qr-btn:disabled { opacity: 0.45; cursor: default; }
        .qr-btn.primary { background: var(--blue-500); border-color: var(--blue-500); color: var(--white); }
        .qr-btn.primary:hover { background: var(--blue-600); }
        .qr-btn.primary:disabled { background: var(--blue-500); }

        /* ── Order detail overlay ── */
        .order-detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            z-index: 50;
            align-items: flex-start;
            justify-content: center;
            padding-top: 12vh;
        }
        .order-detail-overlay.show { display: flex; }
        .order-detail-modal {
            width: min(680px, calc(100vw - 32px));
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 64px 24px 64px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            position: relative;
        }
        .order-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .order-detail-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--gray-900);
        }
        .order-detail-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .order-detail-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        .order-detail-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            font: inherit;
            font-size: 20px;
            line-height: 1;
            color: var(--gray-400);
            cursor: pointer;
            z-index: 1;
        }
        .order-detail-close:hover {
            background: var(--gray-100);
            color: var(--gray-600);
        }
        .order-detail-btn {
            height: 36px;
            padding: 0 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--gray-200);
            background: var(--white);
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-700);
            cursor: pointer;
        }
        .order-detail-btn:hover { background: var(--gray-50); }
        .order-detail-btn.primary {
            background: #f0f4ff;
            border-color: var(--gray-200);
            color: var(--blue-500);
        }
        .order-detail-btn.primary:hover { background: var(--blue-50); }
        .order-detail-btn.danger {
            border-color: #ffc8c8;
            color: var(--red-500);
        }
        .order-detail-btn.danger:hover { background: var(--red-50); }
        .order-detail-meta {
            display: flex;
            gap: 8px;
        }
        .order-detail-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 99px;
            background: var(--gray-100);
            color: var(--gray-600);
        }
        .order-detail-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px 0;
            border-top: 1px solid var(--gray-200);
            border-bottom: 1px solid var(--gray-200);
        }
        .order-detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            font-size: 15px;
            color: var(--gray-800);
        }
        .order-detail-item-name { font-weight: 700; }
        .order-detail-item-qty {
            min-width: 52px;
            text-align: right;
            font-weight: 700;
            color: var(--gray-600);
        }
        .order-detail-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }
        .order-detail-total .label {
            font-size: 15px;
            font-weight: 700;
            color: var(--gray-800);
        }
        .order-detail-total .amount {
            font-size: 22px;
            font-weight: 800;
            color: var(--gray-900);
        }
        .order-cancel-confirm {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
            padding: 12px;
            border: 1px solid #ffc8c8;
            border-radius: var(--radius-sm);
            background: var(--red-50);
        }
        .order-cancel-confirm.show { display: flex; }
        .order-cancel-message {
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-800);
        }
        .order-cancel-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        /* ── Custom input modal ── */
        .custom-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .custom-overlay.show { display: flex; }
        .custom-modal {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .custom-modal h3 { font-size: 16px; font-weight: 700; color: var(--gray-800); }
        .custom-modal input {
            height: 40px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            padding: 0 12px;
            font: inherit;
            font-size: 14px;
        }
        .custom-modal input:focus { outline: none; border-color: var(--blue-500); }
        .custom-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .custom-btn {
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--gray-200);
            background: var(--white);
            color: var(--gray-700);
            cursor: pointer;
        }
        .custom-btn:hover { background: var(--gray-50); }
        .custom-btn.primary { background: var(--blue-500); border-color: var(--blue-500); color: var(--white); }
        .custom-btn.primary:hover { background: var(--blue-600); }

        @media (max-width: 760px) {
            .main { grid-template-columns: 1fr; }
            .queue-pane { border-left: 0; border-top: 1px solid var(--gray-200); }
        }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="paymentMethodOverlay" class="qr-overlay" aria-hidden="true">
    <div class="qr-modal" role="dialog" aria-modal="true" aria-labelledby="paymentMethodTitle">
        <div class="qr-order-num" id="paymentMethodTitle">결제수단 선택</div>
        <div class="qr-amount" id="paymentMethodAmount">0원</div>
        <div class="pay-method-options">
            <button class="pay-method-option" id="btnPayCash" type="button">현금</button>
            <button class="pay-method-option" id="btnPayCard" type="button">카드 단말기</button>
            <button class="pay-method-option kakao" id="btnPayKakao" type="button">카카오페이</button>
        </div>
        <div class="qr-btns">
            <button class="qr-btn" id="paymentMethodCloseButton" type="button">닫기</button>
        </div>
    </div>
</div>

<div id="orderDetailOverlay" class="order-detail-overlay" aria-hidden="true">
    <div class="order-detail-modal" role="dialog" aria-modal="true" aria-labelledby="orderDetailTitle">
        <div class="order-detail-header">
            <div class="order-detail-title-wrap">
                <h2 class="order-detail-title" id="orderDetailTitle">주문 확인</h2>
                <div class="order-detail-meta">
                    <span class="order-detail-badge" id="orderDetailStatus">-</span>
                    <span class="order-detail-badge" id="orderDetailPayment">-</span>
                </div>
            </div>
            <button class="order-detail-close" id="orderDetailCloseButton" type="button" aria-label="닫기">×</button>
            <div class="order-detail-actions">
                <button class="order-detail-btn primary" id="orderDeliverButton" type="button">전달완료</button>
                <button class="order-detail-btn danger" id="orderCancelButton" type="button">주문 취소</button>
            </div>
        </div>
        <div class="order-detail-items" id="orderDetailItems"></div>
        <div class="order-detail-total">
            <span class="label">합계</span>
            <span class="amount" id="orderDetailTotal">0원</span>
        </div>
        <div class="order-cancel-confirm" id="orderCancelConfirm">
            <span class="order-cancel-message">해당 주문을 취소하시겠습니까?</span>
            <div class="order-cancel-actions">
                <button class="order-detail-btn" id="orderCancelDismissButton" type="button">아니오</button>
                <button class="order-detail-btn danger" id="orderCancelConfirmButton" type="button">주문 취소</button>
            </div>
        </div>
    </div>
</div>

<header class="header">
    <div class="header-left">
        <span class="logo">POS</span>
        <nav class="tabs">
            <a class="tab active" href="/">메뉴</a>
            <a class="tab" href="/manage">관리</a>
        </nav>
    </div>
    <div class="header-right">
        <span id="storeName">매장명: -</span>
        <span id="businessDate"></span>
    </div>
</header>

<div class="main">
    <section class="pos-pane" id="posPane">
        <div class="section-label">메뉴 선택</div>
        <div class="menu-grid" id="menuGrid"></div>
        <p id="emptyMessage" class="empty-msg" hidden>표시할 메뉴가 없습니다.</p>

        <div class="order-card" id="orderCard">
            <div class="order-header">
                <h2>현재 주문</h2>
                <button class="clear-btn">전체 삭제</button>
            </div>
            <div class="order-items" id="orderItems">
                <div class="order-empty">메뉴를 선택해주세요</div>
            </div>
            <div class="order-total">
                <span class="label">합계</span>
                <span class="amount" id="orderTotal">0원</span>
            </div>
            <div class="pay-row">
                <button class="pay-btn primary" id="btnSubmitOrder" disabled>주문하기</button>
            </div>
        </div>
    </section>

    <aside class="queue-pane" id="queuePane">
        <div class="queue-title">고객 대기</div>
        <div id="slots"></div>
        <div id="emptySlots" class="queue-empty">대기 중인 주문이 없습니다</div>
    </aside>
</div>

<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
<script src="/js/pos/index.js"></script>
</body>
</html>
