<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재료 관리</title>
    <link rel="stylesheet" href="/css/pos/header.css">
    <style>
        :root{
            /* 공통 헤더/사이드바(header.css)가 쓰는 변수 — 제거 금지 */
            --white:#ffffff;
            --gray-50:#f9fafb; --gray-100:#f2f4f6; --gray-200:#e5e8eb;
            --gray-400:#b0b8c1; --gray-500:#8b95a1; --gray-600:#6b7684;
            --gray-800:#333d4b; --gray-900:#191f28;
            --blue-50:#e8f3ff; --blue-500:#3182f6; --blue-600:#2272eb;
            --radius-sm:8px;

            /* 콘텐츠(시안) 팔레트 */
            --ink:#16181D; --bg:#F6F7F9; --card:#FFFFFF;
            --border:#ECEDF1; --border-strong:#E2E4E9;
            --text:#15181D; --text-2:#5C636E; --text-3:#8A909B;
            --brand:#5E6AD2; --brand-strong:#4F5BC4; --brand-soft:#EEEFFB;
            --gray-bg:#F1F2F4; --gray-tx:#5B616B; --gray-dot:#9AA0AA;
            --amber-bg:#FDF0E1; --amber-tx:#B45309; --amber-dot:#F59E0B;
            --blue-bg:#E9F1FE; --blue-tx:#1D4ED8; --blue-dot:#3B82F6;
            --green-bg:#E7F5EC; --green-tx:#15803D; --green-dot:#16A34A;
            --shadow:0 1px 2px rgba(20,24,33,.04), 0 1px 3px rgba(20,24,33,.03);
            --radius:12px;
        }
        *{box-sizing:border-box; margin:0; padding:0}
        body{
            font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
            background:var(--bg); color:var(--text); min-height:100vh;
            -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
        }
        .tnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

        /* ===== 우리 POS 크롬 (헤더 fragment + 좌측 메뉴) — 원래 톤 유지 ===== */
        .manage-layout{display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 56px)}
        .manage-sidebar{background:var(--white); border-right:1px solid var(--gray-200); padding:20px 16px}
        .manage-nav{display:flex; align-items:center; width:100%; min-height:40px; margin-bottom:4px; padding:0 10px; border-radius:var(--radius-sm); color:var(--gray-600); font-size:14px; font-weight:700; text-decoration:none}
        .manage-nav:hover{background:var(--gray-100); color:var(--gray-800)}
        .manage-nav.active{background:var(--blue-50); color:var(--blue-500)}
        .manage-panel{display:flex; flex-direction:column; min-width:0; overflow-y:auto}

        /* ===== 콘텐츠 상단 토픽바 (시안과 동일) ===== */
        .topbar{min-height:64px; background:rgba(246,247,249,.85); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 28px; position:sticky; top:0; z-index:5}
        .topbar h1{font-size:18px; font-weight:700; letter-spacing:-.02em}
        .topbar .sub{font-size:12.5px; color:var(--text-3); margin-top:2px}
        .supplier{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--text-2); background:var(--card); border:1px solid var(--border); border-radius:9px; padding:8px 13px}
        .supplier .d{width:7px; height:7px; border-radius:50%; background:var(--brand)}

        .content{padding:24px 28px 40px}
        .manage-content{max-width:880px; width:100%}

        /* ===== 콘텐츠 (시안과 동일) ===== */
        .sec-head{display:flex; align-items:baseline; justify-content:space-between; margin:0 2px 11px}
        .sec-title{font-size:15px; font-weight:700; letter-spacing:-.02em}
        .sec-sub{font-size:12.5px; color:var(--text-3)}

        .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}

        /* 재료 주문 */
        .supply{margin-bottom:30px; padding:6px 22px 20px}
        .mat-row{display:flex; align-items:center; justify-content:space-between; gap:18px; padding:20px 0; border-bottom:1px solid #F2F3F5}
        .mat-left{display:flex; align-items:center; gap:14px; min-width:0}
        .mat-mark{width:44px; height:44px; flex:0 0 auto; border-radius:11px; background:var(--brand-soft); display:grid; place-items:center}
        .mat-mark svg{width:23px; height:23px; color:var(--brand-strong)}
        .mat-name{font-size:16px; font-weight:700}
        .mat-unit{font-size:13px; color:var(--text-3); font-weight:500; margin-top:3px}
        .mat-unit b{color:var(--text-2); font-weight:700}
        .mat-right{display:flex; align-items:center; gap:20px}
        .stepper{display:flex; align-items:center; gap:6px}
        .step-btn{width:40px; height:40px; border:1px solid var(--border); border-radius:8px; background:var(--card); font-size:22px; font-weight:600; color:var(--text); cursor:pointer; display:grid; place-items:center; transition:.12s; line-height:1}
        .step-btn:hover{border-color:var(--brand); color:var(--brand-strong)}
        .step-btn:active{transform:scale(.94)}
        .step-btn:disabled{color:var(--text-3); border-color:var(--border); background:var(--card); opacity:.45; cursor:default; transform:none}
        .qty-wrap{display:flex; align-items:center; justify-content:center; gap:2px; height:40px; padding:0 10px; background:var(--card); border:1px solid var(--border); border-radius:8px}
        .qty-wrap:focus-within{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
        .qty-input{width:52px; border:0; background:transparent; outline:none; text-align:center; font:inherit; font-size:18px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; padding:0}
        .uu{font-size:12px; color:var(--text-3); font-weight:600}
        .subtotal{min-width:118px; text-align:right; font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
        .subtotal.zero{color:var(--text-3)}

        .supply-foot{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:22px 2px 4px; border-top:2px solid var(--gray-bg); margin-top:4px}
        .total-lbl{font-size:14px; font-weight:600; color:var(--text-2)}
        .total-amt{font-size:26px; font-weight:800; letter-spacing:-.02em; margin-left:10px; font-variant-numeric:tabular-nums}
        .order-btn{height:52px; padding:0 30px; border:0; border-radius:11px; background:var(--brand); color:#fff; font:inherit; font-size:15.5px; font-weight:700; cursor:pointer; transition:.15s; box-shadow:0 1px 2px rgba(79,91,196,.35)}
        .order-btn:hover{background:var(--brand-strong)}
        .order-btn:disabled{background:var(--gray-bg); color:var(--text-3); cursor:default; box-shadow:none}

        /* 희망 배송일 — 품목 행이 아니라 주문 옵션 패널로 구분 */
        .delivery{display:flex; align-items:center; justify-content:space-between; gap:16px; margin:20px 0 20px 0; padding:14px 16px; background:#FAFBFC; border:1px solid var(--border); border-radius:10px}
        .delivery-info{display:flex; align-items:center; gap:10px; min-width:0}
        .delivery-ic{display:grid; place-items:center; width:18px; height:18px; flex:0 0 auto; color:var(--text-3)}
        .delivery-ic svg{width:18px; height:18px}
        .delivery-text{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; min-width:0}
        .delivery-label{font-size:14px; font-weight:700; color:var(--text)}
        .delivery-hint{font-size:12.5px; color:var(--text-3); font-weight:500}
        .date-input{height:40px; padding:0 12px; border:1px solid var(--border-strong); border-radius:8px; background:var(--card); font:inherit; font-size:15px; font-weight:700; color:var(--text); cursor:pointer; font-variant-numeric:tabular-nums}
        .date-input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
        .date-input::-webkit-calendar-picker-indicator{cursor:pointer; opacity:.55}

        /* 발주 현황 */
        .hist{display:flex; flex-direction:column}
        .hist-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 20px; border-bottom:1px solid #F2F3F5}
        .hist-row:last-child{border-bottom:0}
        .hist-left{min-width:0}
        .hist-top{display:flex; align-items:center; gap:9px; margin-bottom:5px}
        .hist-date{font-size:12.5px; color:var(--text-3); font-weight:600; font-variant-numeric:tabular-nums}
        .hist-items{font-size:14.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
        .hist-right{display:flex; align-items:center; gap:16px; flex:0 0 auto}
        .hist-amt{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums}

        .chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap}
        .chip .dot{width:6px; height:6px; border-radius:50%}
        .chip.confirm{background:var(--gray-bg); color:var(--gray-tx)} .chip.confirm .dot{background:var(--gray-dot)}
        .chip.pay{background:var(--amber-bg); color:var(--amber-tx)} .chip.pay .dot{background:var(--amber-dot)}
        .chip.ship{background:var(--blue-bg); color:var(--blue-tx)} .chip.ship .dot{background:var(--blue-dot)}
        .chip.done{background:var(--green-bg); color:var(--green-tx)} .chip.done .dot{background:var(--green-dot)}

        .order-empty{font-size:13px; color:var(--text-3); text-align:center; padding:44px 0}
        .more-btn{display:block; width:100%; padding:14px 0; border:0; border-top:1px solid #F2F3F5; background:transparent; color:var(--text-2); font:inherit; font-size:13px; font-weight:700; cursor:pointer}
        .more-btn:hover{color:var(--text)}

        /* 모달 */
        .overlay{position:fixed; inset:0; background:rgba(20,24,33,.45); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; padding:24px; z-index:100}
        .overlay.open{display:flex}
        .modal{width:100%; max-width:440px; background:var(--card); border:1px solid var(--border-strong); border-radius:16px; box-shadow:0 20px 50px rgba(20,24,33,.25); overflow:hidden; animation:pop .22s cubic-bezier(.22,.61,.36,1)}
        @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98)} to{opacity:1; transform:none}}
        .modal-head{padding:22px 24px 16px; border-bottom:1px solid var(--border)}
        .modal-head .t{font-size:18px; font-weight:700; letter-spacing:-.02em}
        .modal-head .s{font-size:12.5px; color:var(--text-3); margin-top:4px}
        .modal-list{padding:18px 24px; display:flex; flex-direction:column; gap:15px}
        .m-row{display:flex; align-items:baseline; justify-content:space-between; font-size:15px}
        .m-row .nm{font-weight:600} .m-row .nm .q{color:var(--text-3); font-weight:600; font-size:13px; margin-left:6px}
        .m-row .pr{font-weight:700; font-variant-numeric:tabular-nums}
        .modal-total{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-top:1px solid var(--border); background:#FAFBFC}
        .modal-total .l{font-size:14px; font-weight:600; color:var(--text-2)}
        .modal-total .a{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums}
        .modal-meta{display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-top:1px solid var(--border)}
        .modal-meta .ml{font-size:13px; color:var(--text-2); font-weight:600}
        .modal-meta .mv{font-size:14px; font-weight:700; color:var(--brand-strong); font-variant-numeric:tabular-nums}
        .modal-foot{display:flex; gap:10px; padding:16px 24px 20px}
        .modal-foot button{flex:1; height:50px; border:0; border-radius:11px; font:inherit; font-size:15px; font-weight:700; cursor:pointer}
        .btn-cancel{background:var(--gray-bg); color:var(--text-2)} .btn-cancel:hover{background:var(--border-strong)}
        .btn-confirm{background:var(--brand); color:#fff} .btn-confirm:hover{background:var(--brand-strong)}

        @media (max-width:760px){
            .manage-layout{grid-template-columns:1fr}
            .manage-sidebar{border-right:0; border-bottom:1px solid var(--gray-200)}
            .mat-row{flex-wrap:wrap}
            .subtotal{min-width:0}
            .modal{max-width:none}
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: posHeader('manage')}"></header>

<main class="manage-layout">
    <aside class="manage-sidebar">
        <a class="manage-nav" href="/manage">판매 관리</a>
        <a class="manage-nav active" href="/manage/supply">재료 관리</a>
    </aside>

    <section class="manage-panel">
        <header class="topbar">
            <div>
                <h1>재료 관리</h1>
                <div class="sub">본사에 재료를 발주하고 진행 상황을 확인하세요</div>
            </div>
            <div class="supplier"><span class="d"></span>공급사 · smilepos 본사</div>
        </header>

        <div class="content">
            <div class="manage-content">
                <div class="sec-head">
                    <span class="sec-title">재료 주문</span>
                    <span class="sec-sub">수량을 선택하고 발주하세요</span>
                </div>
                <div class="card supply" id="supplyForm"></div>

                <div class="sec-head">
                    <span class="sec-title">내 발주 현황</span>
                    <span class="sec-sub">최근 발주 내역</span>
                </div>
                <div class="card hist" id="orderList"></div>
            </div>
        </div>
    </section>
</main>

<div class="overlay" id="confirmModal">
    <div class="modal">
        <div class="modal-head">
            <div class="t">발주 확인</div>
            <div class="s">아래 내용으로 본사에 발주를 넣습니다</div>
        </div>
        <div class="modal-list" id="modalList"></div>
        <div class="modal-meta">
            <span class="ml">희망 배송일</span>
            <span class="mv" id="modalDelivery"></span>
        </div>
        <div class="modal-total">
            <span class="l">합계</span>
            <span class="a" id="modalTotal">₩0</span>
        </div>
        <div class="modal-foot">
            <button type="button" class="btn-cancel" id="modalCancel">취소</button>
            <button type="button" class="btn-confirm" id="modalConfirm">발주하기</button>
        </div>
    </div>
</div>

<script src="/js/pos/supply.js?v=4"></script>
</body>
</html>
