<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<header class="header" th:fragment="posHeader(activeTab)">
    <div class="header-left">
        <span class="logo">POS</span>
        <nav class="tabs">
            <a th:class="${activeTab == 'menu'} ? 'tab active' : 'tab'" href="/">메뉴</a>
            <a th:class="${activeTab == 'manage'} ? 'tab active' : 'tab'" href="/manage">관리</a>
        </nav>
    </div>
    <div class="header-right">
        <span id="storeName">매장명: -</span>
        <form class="logout-form" action="/logout" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="logout-btn" type="submit">로그아웃</button>
        </form>
    </div>
</header>
</body>
</html>
