spring:
  application:
    name: pos-saas
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pos_saas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:pos}
    password: ${SPRING_DATASOURCE_PASSWORD:pos}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}

portone:
  store-id: ${PORTONE_STORE_ID:store-test}
  api-secret: ${PORTONE_API_SECRET:test-secret}
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw}
  channel-keys:
    KAKAO_PAY: ${PORTONE_CHANNEL_KEY_KAKAO_PAY:channel-key-test-kakao}

logging:
  level:
    org.hibernate.SQL: debug
