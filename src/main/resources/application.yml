spring:
  application:
    name: pos-saas
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pos_saas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:pos}
    password: ${SPRING_DATASOURCE_PASSWORD:pos}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SERVER_SESSION_TIMEOUT:8h}

# 자동 로그인(remember-me). 매장 태블릿 등 신뢰된 기기에서 30일간 재로그인 없이 유지.
# key는 운영에서 환경변수로 교체 — 비밀번호 변경 시 토큰은 자동 무효화
security:
  remember-me:
    key: ${REMEMBER_ME_KEY:local-dev-remember-me-key}
    validity-seconds: ${REMEMBER_ME_VALIDITY_SECONDS:2592000}

# 주기 작업은 기본 꺼짐. 운영 .env 에 SCHEDULING_ENABLED=true 를 명시해야 돈다.
scheduling:
  enabled: ${SCHEDULING_ENABLED:false}

payment:
  reconcile:
    delay: ${PAYMENT_RECONCILE_DELAY:1m}
    grace: ${PAYMENT_RECONCILE_GRACE:3m}
    lookback: ${PAYMENT_RECONCILE_LOOKBACK:30m}
    batch-size: ${PAYMENT_RECONCILE_BATCH_SIZE:50}

portone:
  store-id: ${PORTONE_STORE_ID:store-test}
  api-secret: ${PORTONE_API_SECRET:test-secret}
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:dGVzdC13ZWJob29rLXNlY3JldA==}
  channel-keys:
    KAKAO_PAY:
      test: ${PORTONE_CHANNEL_KEY_KAKAO_PAY:channel-key-test-kakao}
      live: ${PORTONE_CHANNEL_KEY_KAKAO_PAY_LIVE:}
  timeout:
    connect: ${PORTONE_CONNECT_TIMEOUT:500ms}
    read: ${PORTONE_READ_TIMEOUT:500ms}

logging:
  level:
    org.hibernate.SQL: debug
