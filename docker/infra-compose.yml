name: pos-saas

services:
  mysql:
    image: mysql:8.4
    container_name: pos-saas-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: pos_saas
      MYSQL_USER: pos
      MYSQL_PASSWORD: pos
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - pos-saas-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pos-saas-mysql-data:
