events {}

http {
    # round-robin 로드밸런서 — 요청을 app-1 / app-2 로 번갈아 보낸다.
    upstream pos_app {
        server app-1:8080;
        server app-2:8080;
    }

    server {
        listen 80;

        # SSE 스트림 전용 — 버퍼링 끄고(이벤트 즉시 통과) 타임아웃 늘림(조용해도 연결 유지).
        location /api/v1/orders/waiting/stream {
            proxy_pass http://pos_app;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering    off;
            proxy_read_timeout 3600s;
            add_header X-Served-By $upstream_addr always;
        }

        location / {
            proxy_pass http://pos_app;
            # $http_host: 포트 포함 Host 전달(앱 리다이렉트가 :8080 을 잃지 않도록).
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 어느 인스턴스가 처리했는지 확인용(새로고침마다 app-1 ↔ app-2).
            add_header X-Served-By $upstream_addr always;
        }
    }
}